services:
  ebook-manager:
    build: .
    image: hajtran/ebooks-directory:latest
    container_name: ebook-manager
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      - ${NAS_PATH}:/books
    environment:
      - BOOKS_PATH=/books
      - PUPPETEER_USER_DATA_DIR=/tmp/puppeteer_profile
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8