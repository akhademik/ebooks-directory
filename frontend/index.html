<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Book Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 min-h-screen text-slate-200">

    <!-- Header -->
    <header class="bg-slate-900 shadow-xl sticky top-0 z-10 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-500 p-2 rounded-lg text-white">
                    <i class="fas fa-book-open text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">BookLibrary</h1>
            </div>

            <div class="flex flex-1 max-w-xl w-full">
                <div class="relative w-full">
                    <input type="text" id="searchInput" placeholder="Search by title or author..." 
                           class="w-full pl-10 pr-4 py-2 bg-slate-800 border border-slate-700 rounded-full text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    <i class="fas fa-search absolute left-4 top-3 text-slate-500"></i>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="scanBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 shadow-lg shadow-indigo-900/20">
                    <i class="fas fa-sync-alt" id="scanIcon"></i>
                    <span>Scan Library</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Status Bar -->
        <div id="statusArea" class="hidden mb-6 p-4 rounded-lg bg-slate-900 border border-indigo-500/30 flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="animate-spin text-indigo-400">
                        <i class="fas fa-circle-notch"></i>
                    </div>
                    <span class="text-slate-300 font-medium" id="statusText">Scanning NAS...</span>
                </div>
                <span id="scanProgress" class="text-xs font-mono text-indigo-400">0/0</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-1.5">
                <div id="progressBar" class="bg-indigo-500 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Grid -->
        <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <!-- Loading Skeletons -->
            <div class="animate-pulse bg-white rounded-xl h-64 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white rounded-xl h-64 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white rounded-xl h-64 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white rounded-xl h-64 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white rounded-xl h-64 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white rounded-xl h-64 shadow-sm border border-slate-100"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-slate-400">
            <i class="fas fa-books text-6xl mb-4 opacity-20"></i>
            <p class="text-xl font-medium">No books found.</p>
            <p class="text-sm">Try scanning your library or adjust your search.</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
