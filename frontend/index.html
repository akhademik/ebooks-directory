<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ebook Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --accent: #6366f1;
        --accent-dim: rgba(99, 102, 241, 0.12);
        --accent-hover: #818cf8;
        --surface: #121826;
        --surface-raised: #1a2133;
        --border: rgba(255, 255, 255, 0.06);
        --border-hover: rgba(255, 255, 255, 0.12);
        --text-primary: #f1f5f9;
        --text-secondary: #64748b;
        --text-muted: #334155;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: #0b0f1a;
        color: var(--text-primary);
        font-family: "Inter", system-ui, sans-serif;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--text-muted);
        border-radius: 10px;
      }

      /* Scan status bar */
      #statusArea {
        background: rgba(17, 24, 39, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      /* Table */
      .table-container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      .table-header-row {
        display: grid;
        grid-template-columns: 44px 1fr 90px 80px 48px 48px;
        gap: 0;
        padding: 10px 20px;
        background: var(--surface-raised);
        border-bottom: 1px solid var(--border);
      }

      .th {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        user-select: none;
        transition: color 0.15s;
      }

      .th:hover {
        color: var(--text-secondary);
      }

      .th.sorted {
        color: var(--accent);
      }

      .th .sort-icon {
        font-size: 9px;
        opacity: 0.5;
      }

      .th.sorted .sort-icon {
        opacity: 1;
      }

      /* Filter row */
      .filter-row {
        display: grid;
        grid-template-columns: 44px 1fr 90px 80px 48px 48px;
        gap: 0;
        padding: 8px 20px;
        background: rgba(11, 15, 26, 0.6);
        border-bottom: 1px solid var(--border);
        align-items: center;
      }

      .filter-input {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 11px;
        color: var(--text-primary);
        width: 100%;
        outline: none;
        transition: border-color 0.15s;
      }

      .filter-input:focus {
        border-color: rgba(99, 102, 241, 0.5);
      }

      .filter-input::placeholder {
        color: var(--text-muted);
      }

      .search-wrap {
        position: relative;
      }

      .search-wrap i {
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10px;
        color: var(--text-muted);
        pointer-events: none;
      }

      .search-wrap .filter-input {
        padding-left: 26px;
      }

      select.filter-input {
        appearance: none;
        cursor: pointer;
      }

      /* Size range filter */
      .size-range-wrap {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .size-range-wrap .filter-input {
        text-align: center;
      }

      .size-sep {
        font-size: 10px;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      /* Book rows */
      .book-row {
        display: grid;
        grid-template-columns: 44px 1fr 90px 80px 48px 48px;
        gap: 0;
        padding: 8px 20px;
        align-items: center;
        border-bottom: 1px solid var(--border);
        transition: background 0.12s;
        position: relative;
      }

      .book-row:last-child {
        border-bottom: none;
      }

      .book-row:hover {
        background: rgba(255, 255, 255, 0.025);
      }

      .row-idx {
        font-size: 11px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }

      /* Book info cell */
      .book-info {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .cover-thumb {
        width: 32px;
        height: 44px;
        border-radius: 4px;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        flex-shrink: 0;
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.15s,
          border-color 0.15s;
      }

      .cover-thumb:hover {
        transform: scale(1.08);
        border-color: var(--border-hover);
      }

      .cover-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .book-text {
        min-width: 0;
      }

      .book-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }

      .book-title a {
        color: inherit;
        text-decoration: none;
      }

      .book-title a:hover {
        color: var(--accent-hover);
      }

      .book-author {
        font-size: 11px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }

      .book-rating {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 3px;
      }

      .stars {
        font-size: 9px;
        color: #f59e0b;
        letter-spacing: 0.5px;
      }

      .rating-val {
        font-size: 9px;
        color: var(--text-muted);
        font-weight: 700;
      }

      /* Format badge */
      .format-badge {
        display: inline-block;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.06em;
        padding: 2px 7px;
        border-radius: 999px;
      }

      .badge-epub {
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
        border: 1px solid rgba(52, 211, 153, 0.2);
      }

      .badge-pdf {
        background: rgba(239, 68, 68, 0.1);
        color: #f87171;
        border: 1px solid rgba(248, 113, 113, 0.2);
      }

      .badge-mobi {
        background: rgba(168, 85, 247, 0.1);
        color: #c084fc;
        border: 1px solid rgba(192, 132, 252, 0.2);
      }

      .badge-azw3 {
        background: rgba(251, 191, 36, 0.1);
        color: #fbbf24;
        border: 1px solid rgba(251, 191, 36, 0.2);
      }

      .badge-book {
        background: rgba(100, 116, 139, 0.1);
        color: #94a3b8;
        border: 1px solid rgba(148, 163, 184, 0.15);
      }

      /* Size cell */
      .size-cell {
        font-size: 11px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }

      /* Action buttons */
      .action-cell {
        display: flex;
        justify-content: center;
      }

      .icon-btn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 12px;
        text-decoration: none;
        transition: all 0.15s;
      }

      .icon-btn:hover {
        border-color: var(--border-hover);
        background: var(--accent-dim);
        color: var(--accent-hover);
      }

      .icon-btn:disabled,
      .icon-btn.disabled {
        opacity: 0.2;
        cursor: not-allowed;
        pointer-events: none;
      }

      .icon-btn.download:hover {
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
        border-color: rgba(52, 211, 153, 0.3);
      }

      /* Manual badge */
      .manual-tag {
        position: absolute;
        top: 0;
        right: 0;
        background: #f59e0b;
        color: #1c1917;
        font-size: 8px;
        font-weight: 800;
        padding: 2px 6px;
        border-bottom-left-radius: 6px;
        letter-spacing: 0.05em;
      }

      /* Progress bar */
      #progressBar {
        transition: width 0.4s ease;
      }

      /* Modal */
      #previewModal {
        display: none;
      }

      #previewModal.open {
        display: flex;
      }

      .modal-inner {
        background: #0d1117;
        border: 1px solid var(--border-hover);
        border-radius: 20px;
        width: 100%;
        max-width: 900px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        z-index: 10;
      }

      .modal-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface);
        flex-shrink: 0;
      }

      .modal-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 700px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .modal-icon {
        width: 28px;
        height: 28px;
        background: var(--accent-dim);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-size: 12px;
        flex-shrink: 0;
      }

      .close-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: all 0.15s;
        flex-shrink: 0;
      }

      .close-btn:hover {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
        border-color: rgba(248, 113, 113, 0.3);
      }

      #previewContent {
        flex: 1;
        overflow-y: auto;
        padding: 32px;
        background: #0b0f1a;
      }

      #previewContent::-webkit-scrollbar {
        width: 4px;
      }

      #previewContent::-webkit-scrollbar-thumb {
        background: var(--text-muted);
        border-radius: 10px;
      }

      .epub-preview-content {
        font-size: 16px;
        line-height: 1.8;
        color: #cbd5e1;
      }

      .epub-preview-content h1,
      .epub-preview-content h2,
      .epub-preview-content h3 {
        color: var(--text-primary);
        margin: 1.5em 0 0.5em;
      }

      .epub-preview-content p {
        margin-bottom: 1em;
      }

      /* Stat chips in header */
      .stat-chip {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        background: var(--surface-raised);
        cursor: pointer;
        transition: all 0.15s;
        font-weight: 600;
      }

      .stat-chip:hover {
        border-color: var(--border-hover);
        color: var(--text-primary);
      }

      .stat-chip.active {
        background: var(--accent-dim);
        color: var(--accent-hover);
        border-color: rgba(99, 102, 241, 0.3);
      }

      /* Result count */
      .result-count {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 600;
        padding: 6px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(11, 15, 26, 0.4);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      /* Spinning */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .spinning {
        animation: spin 0.8s linear infinite;
      }

      /* Empty state */
      #emptyState {
        display: none;
      }

      #emptyState.visible {
        display: flex;
      }
    </style>
  </head>

  <body>
    <!-- Scan Status Bar -->
    <div id="statusArea" class="hidden sticky top-0 z-50 px-6 py-2.5 shadow-lg">
      <div
        class="max-w-[1400px] mx-auto flex items-center justify-between gap-6 text-xs font-bold tracking-wider uppercase"
      >
        <div class="flex items-center gap-3">
          <i
            class="fas fa-circle-notch fa-spin text-indigo-400"
            style="font-size: 13px"
          ></i>
          <span id="statusText" class="text-slate-300">Scanning library…</span>
        </div>
        <div
          class="flex-1 max-w-sm bg-slate-900 rounded-full h-1 overflow-hidden border border-white/5"
        >
          <div
            id="progressBar"
            class="bg-indigo-500 h-full"
            style="width: 0%"
          ></div>
        </div>
        <span
          id="scanProgress"
          class="text-slate-400 tabular-nums min-w-[55px] text-right"
          >0 / 0</span
        >
      </div>
    </div>

    <!-- Main Layout -->
    <main class="max-w-[1400px] mx-auto px-4 py-8 md:px-8">
      <!-- Header -->
      <header
        class="flex flex-col md:flex-row md:items-center justify-between gap-5 mb-8"
      >
        <div>
          <h1
            class="text-2xl font-black text-white tracking-tight flex items-center gap-3"
          >
            <i
              class="fas fa-book-open text-indigo-500"
              style="font-size: 22px"
            ></i>
            Ebook Manager
          </h1>
          <p class="text-slate-500 text-xs font-medium mt-1">
            Your personal digital library
          </p>
        </div>

        <div class="flex items-center gap-3 flex-wrap">
          <!-- Format chips (clickable quick filters) -->
          <div id="formatChips" class="flex items-center gap-2">
            <button class="stat-chip" data-format="">All</button>
            <button class="stat-chip" data-format="epub">EPUB</button>
            <button class="stat-chip" data-format="pdf">PDF</button>
            <button class="stat-chip" data-format="mobi">MOBI</button>
            <button class="stat-chip" data-format="azw3">AZW3</button>
          </div>

          <div class="w-px h-5 bg-slate-700"></div>

          <!-- Book count -->
          <span
            id="headerCount"
            class="text-xs text-slate-500 font-semibold tabular-nums"
            >0 books</span
          >

          <div class="w-px h-5 bg-slate-700"></div>

          <button
            id="scanBtn"
            class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-700 text-slate-400 hover:text-white hover:border-indigo-500/50 hover:bg-indigo-500/10 text-xs font-bold uppercase tracking-widest transition-all"
            title="Force a full scan and bypass cache"
          >
            <i
              id="scanIcon"
              class="fas fa-sync-alt"
              style="font-size: 11px"
            ></i>
            Force Scan
          </button>
        </div>
      </header>

      <!-- Table -->
      <div class="table-container">
        <!-- Sortable column headers -->
        <div class="table-header-row">
          <div class="th" style="cursor: default">#</div>
          <div class="th" id="th-title" data-sort="title">
            Title / Author
            <i class="fas fa-sort sort-icon"></i>
          </div>
          <div class="th" id="th-ext" data-sort="ext">
            Format
            <i class="fas fa-sort sort-icon"></i>
          </div>
          <div class="th" id="th-size" data-sort="size">
            Size
            <i class="fas fa-sort sort-icon"></i>
          </div>
          <div class="th" style="justify-content: center; cursor: default">
            View
          </div>
          <div class="th" style="justify-content: center; cursor: default">
            Get
          </div>
        </div>

        <!-- Filters -->
        <div class="filter-row">
          <div></div>
          <div class="search-wrap pr-2">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="searchInput"
              class="filter-input"
              placeholder="Search title or author…"
            />
          </div>
          <div class="pr-2">
            <select id="typeFilter" class="filter-input">
              <option value="">All formats</option>
              <option value="epub">EPUB</option>
              <option value="pdf">PDF</option>
              <option value="mobi">MOBI</option>
              <option value="azw3">AZW3</option>
            </select>
          </div>
          <div class="size-range-wrap pr-2">
            <input
              type="number"
              id="minSize"
              class="filter-input"
              placeholder="Min"
              min="0"
              step="0.1"
            />
            <span class="size-sep">–</span>
            <input
              type="number"
              id="maxSize"
              class="filter-input"
              placeholder="Max"
              min="0"
              step="0.1"
            />
          </div>
          <div></div>
          <div></div>
        </div>

        <!-- Result count row -->
        <div class="result-count">
          <span id="resultCount">0 books</span>
          <span id="sortLabel" class="text-slate-600"></span>
        </div>

        <!-- Book rows -->
        <div id="bookGrid"></div>

        <!-- Empty state (inside table) -->
        <div
          id="emptyState"
          class="flex-col items-center justify-center py-24 text-slate-600"
        >
          <div
            class="w-16 h-16 bg-slate-900 rounded-full flex items-center justify-center mb-5 border border-slate-800"
          >
            <i class="fas fa-book-open text-3xl opacity-20"></i>
          </div>
          <p class="text-base font-black text-slate-500 tracking-tight">
            No books found
          </p>
          <p class="text-xs font-medium mt-1">
            Try a different search or scan your library
          </p>
        </div>
      </div>
    </main>

    <!-- Preview Modal -->
    <div
      id="previewModal"
      class="fixed inset-0 z-[100] items-center justify-center p-4"
    >
      <div
        class="absolute inset-0 bg-black/90 backdrop-blur-sm"
        id="modalOverlay"
      ></div>
      <div class="modal-inner">
        <div class="modal-header">
          <div class="modal-title">
            <div class="modal-icon"><i class="fas fa-eye"></i></div>
            <span id="previewTitle">Preview</span>
          </div>
          <button id="closeModal" class="close-btn" aria-label="Close preview">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div id="previewContent"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
